<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grant Test Auto</title>
    <!-- The first frame matches the app's background (styles.css --bg), not white. -->
    <style>
      html { background: #f7f7f5 } @media (prefers-color-scheme: dark) { html { background: #161615 } }
      /* The loading screen, here so it shows before the bundle loads; live.tsx renders the same markup while it connects. */
      .boot { --b-text: #1d1d1b; --b-muted: #6b6b66; --b-line: #e3e2dd; --b-accent: #2f5bd3;
        min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        padding: 16px; font-family: system-ui, -apple-system, sans-serif; text-align: center; }
      @media (prefers-color-scheme: dark) { .boot { --b-text: #ecebe6; --b-muted: #a09f98; --b-line: #34332f; --b-accent: #7c9cf0; } }
      .boot-mark { font-weight: 700; font-size: 28px; letter-spacing: -.01em; color: var(--b-text); }
      .boot-bar { position: relative; width: 160px; height: 3px; border-radius: 3px; background: var(--b-line); overflow: hidden; }
      .boot-bar::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: inherit; background: var(--b-accent); animation: boot-slide 1.1s ease-in-out infinite; }
      @keyframes boot-slide { from { transform: translateX(-100%) } to { transform: translateX(250%) } }
      @media (prefers-reduced-motion: reduce) { .boot-bar::after { animation: none; width: 100%; opacity: .5 } }
      .boot-note { margin: 0; max-width: 320px; font-size: 14px; color: var(--b-muted); }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" />
  </head>
  <body>
    <div id="root"><div class="boot" role="status"><div class="boot-mark">Grant Test Auto</div><div class="boot-bar" aria-hidden="true"></div><p class="boot-note">Loading the grant office…</p></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
