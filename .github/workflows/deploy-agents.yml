# Update the agent worker on the Azure VM whenever main changes it (T26):
# SSH in and run deploy/agent-worker/update.sh (pull, install, restart).
# Needs repo secrets AZURE_VM_HOST (IP or DNS name) and AZURE_VM_SSH_KEY (a
# private key whose public half is in the VM user's authorized_keys); optional
# AZURE_VM_USER (default azureuser). Skips cleanly until they exist.
name: Deploy agents

on:
  push:
    branches: [main]
    paths:
      - 'agents/**'
      - 'server/**'
      - 'sim/**'
      - 'deploy/agent-worker/**'
      - '.github/workflows/deploy-agents.yml'
  workflow_dispatch:

concurrency:
  group: deploy-agents
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    env:
      HOST: ${{ secrets.AZURE_VM_HOST }}
      KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
      VM_USER: ${{ secrets.AZURE_VM_USER || 'azureuser' }}
    steps:
      - name: Skip until the VM secrets exist
        if: env.HOST == '' || env.KEY == ''
        run: echo "::notice::AZURE_VM_HOST / AZURE_VM_SSH_KEY not set; nothing to deploy"
      # A push that changes server/ also publishes the module. A worker started
      # before that publish finishes subscribes to tables maincloud doesn't have
      # yet and crashes, so wait for it. No publish run for this commit: go on.
      - name: Wait for this commit's module publish
        if: env.HOST != '' && env.KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state() { gh run list -R "$GITHUB_REPOSITORY" --workflow publish-module.yml --commit "$GITHUB_SHA" \
            --json status,conclusion -q '.[0] // empty | "\(.status) \(.conclusion)"'; }
          for i in $(seq 90); do
            s=$(state)
            if [ -z "$s" ] && [ "$i" -gt 3 ]; then echo "No module publish for this commit"; exit 0; fi
            case "$s" in
              "completed success") echo "Module published"; exit 0 ;;
              completed*) echo "::error::The module publish for this commit ended '$s'; not starting a worker against the old module"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Gave up waiting for the module publish"; exit 1
      - name: Update the VM
        if: env.HOST != '' && env.KEY != ''
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_vm && chmod 600 ~/.ssh/id_vm
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_vm "$VM_USER@$HOST" /opt/grantguard/deploy/agent-worker/update.sh
